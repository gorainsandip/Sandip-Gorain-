<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sago Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="loginView">
  <div class="brand" style="font-size:32px">Sago<span>.</span> Admin</div>
  <p style="color:var(--muted)">শুধু অনুমোদিত ইমেইল দিয়ে লগইন করা যাবে</p>
  <button class="google-btn" id="googleLoginBtn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.3 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c2.8 0 5.3 1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5c-7.7 0-14.3 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5 0 9.5-1.9 12.9-5.1l-6-5c-2 1.4-4.5 2.1-6.9 2.1-5.3 0-9.7-3.6-11.3-8.4l-6.5 5C9.6 39 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.4l6 5C40.8 35.4 43.5 30.1 43.5 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
    গুগল দিয়ে লগইন করুন
  </button>
</div>

<!-- App -->
<div class="admin-shell" id="appView" style="display:none">
  <div class="admin-top">
    <div class="brand" style="font-size:20px">Sago<span>.</span> Admin</div>
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="admin-tag" id="adminEmailTag"></span>
      <button class="btn-secondary" id="logoutBtn">লগ আউট</button>
    </div>
  </div>
  <div class="admin-body">
    <nav class="admin-nav">
      <button class="active" data-tab="products">প্রোডাক্ট</button>
      <button data-tab="orders" id="navOrders">অর্ডার</button>
      <button data-tab="admins" id="navAdmins" style="display:none">অ্যাডমিন ম্যানেজ</button>
    </nav>
    <div class="admin-main">

      <div class="tab-panel" id="tab-products">
        <div class="admin-row-head">
          <h2 style="margin:0">প্রোডাক্টসমূহ</h2>
          <button class="btn-primary" style="width:auto;padding:10px 18px" id="newProductBtn">+ নতুন প্রোডাক্ট</button>
        </div>
        <table class="admin-table">
          <thead><tr><th></th><th>নাম</th><th>দাম</th><th>স্টক</th><th>অবস্থা</th><th>অ্যাকশন</th></tr></thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </div>

      <div class="tab-panel" id="tab-orders" style="display:none">
        <div class="admin-row-head"><h2 style="margin:0">অর্ডারসমূহ</h2></div>
        <div id="ordersList"></div>
      </div>

      <div class="tab-panel" id="tab-admins" style="display:none">
        <div class="admin-row-head"><h2 style="margin:0">অ্যাডমিন ম্যানেজমেন্ট</h2></div>
        <form id="addAdminForm" style="display:flex;gap:10px;margin-bottom:20px;max-width:460px">
          <input type="email" id="newAdminEmail" placeholder="admin@gmail.com" required style="flex:1;padding:11px 12px;border:1px solid var(--line)">
          <button class="btn-primary" style="width:auto;padding:11px 18px">যোগ করুন</button>
        </form>
        <div id="adminsList"></div>
      </div>

    </div>
  </div>
</div>

<!-- Product form -->
<div class="overlay" id="productFormOverlay">
  <div class="sheet" style="max-width:640px">
    <div class="sheet-head">
      <h2 id="pfTitle">নতুন প্রোডাক্ট</h2>
      <button class="icon-btn" id="closeProductForm">✕</button>
    </div>
    <div class="sheet-body">
      <form id="productForm">
        <div class="field">
          <label>প্রোডাক্টের ছবি <span class="opt">(একাধিক দেওয়া যাবে, ঐচ্ছিক)</span></label>
          <div class="img-thumbs" id="pfImageThumbs"></div>
          <label class="file-drop" style="display:block">
            গ্যালারি থেকে ছবি বাছাই করুন
            <input type="file" id="pfImageInput" accept="image/*" multiple style="display:none">
          </label>
        </div>
        <div class="field">
          <label>প্রোডাক্টের নাম</label>
          <input type="text" id="pfName" required>
        </div>
        <div class="form-grid">
          <div class="field">
            <label>বর্তমান দাম (৳)</label>
            <input type="number" id="pfPrice" min="0" required>
          </div>
          <div class="field">
            <label>পুরাতন/আগের দাম <span class="opt">(ডিসকাউন্ট দেখাতে, ঐচ্ছিক)</span></label>
            <input type="number" id="pfOldPrice" min="0">
          </div>
        </div>
        <div class="field">
          <label>স্টক পরিমাণ <span class="opt">(ফাঁকা রাখলে সীমাহীন ধরা হবে)</span></label>
          <input type="number" id="pfStock" min="0">
        </div>
        <div class="field">
          <label>বিবরণ <span class="opt">(ঐচ্ছিক)</span></label>
          <textarea id="pfDesc"></textarea>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="pfActive" style="width:auto" checked>
          <label style="margin:0">সাইটে দেখানো হবে</label>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button type="submit" class="btn-primary" id="pfSaveBtn">সেভ করুন</button>
          <button type="button" class="btn-danger" id="pfDeleteBtn" style="display:none">ডিলিট</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
